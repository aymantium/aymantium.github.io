{% extends "base.html" %}
{% block content %}
<div class="container">
  <section class="section">
    <div class="section__head"><h1>Tags</h1></div>
    <div class="tag-list">
      {% for t in tags %}<a class="tag" href="{{ (base_path ~ '/tags/' ~ (t | slug) ~ '/') }}">{{ t }} ({{ counts[t] }})</a>{% endfor %}
    </div>
  </section>
</div>
{% endblock %}
