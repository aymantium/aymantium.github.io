{% extends "base.html" %}
{% block content %}
<div class="container">
  <section class="section">
    <div class="section__head"><h1>Writing</h1><span class="section__title">{{ entries | length }} articles</span></div>
    <ul class="list">
      {% for a in entries %}
      <li>
        <div class="list__row">
          <span class="list__date">{{ a.date_str }}</span>
          <a class="list__title" href="{{ a.url | u }}">{{ a.title }}</a>
        </div>
        {% if a.description %}<p style="margin:0.4em 0 0; font-size:0.85rem; color:var(--fg-muted);">{{ a.description }}</p>{% endif %}
      </li>
      {% endfor %}
    </ul>
  </section>
</div>
{% endblock %}
