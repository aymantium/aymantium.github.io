<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} | Aymantium{% else %}Aymantium{% endif %}</title>
  <meta name="description" content="{{ description | default('Personal archive of Aymantium: music, art, writing, and references.') }}">
  <link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
  <link rel="icon" href="{{ base_path }}/assets/images/icon.svg" type="image/svg+xml">
  {% if rss_url %}<link rel="alternate" type="application/rss+xml" title="Aymantium" href="{{ rss_url }}">{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-title" href="{{ base_path }}/"><img src="{{ base_path }}/assets/images/earthclarinetskull.png" alt="Aymantium" width="60" height="61" style="max-height:72px; width:auto; border:none;"></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ base_path }}/music/">Music</a>
        <a href="{{ base_path }}/art/">Art</a>
        <a href="{{ base_path }}/writing/">Writing</a>
        <a href="{{ base_path }}/library/">Library</a>
        <a href="{{ base_path }}/about/">About</a>
        <a href="{{ base_path }}/contact/">Contact</a>
      </nav>
    </div>
    <img src="{{ base_path }}/assets/images/skellipoxer.png" alt="Bottom image" class="bottom-image" width="206" height="526" loading="lazy">
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>Aymantium — independent music, art, and writing.</p>
      <nav class="site-footer__nav" aria-label="Footer">
        <a href="{{ base_path }}/music/">Music</a>
        <a href="{{ base_path }}/art/">Art</a>
        <a href="{{ base_path }}/writing/">Writing</a>
        <a href="{{ base_path }}/library/">Library</a>
        <a href="{{ base_path }}/about/">About</a>
        <a href="{{ base_path }}/feed.xml">RSS</a>
      </nav>
      <p class="site-footer__meta">Built as static HTML. No tracking, no JavaScript required.</p>
      <p style="margin-top:1em;"><img src="{{ base_path }}/assets/images/userbox.png" alt="Aymantium" width="242" height="49" loading="lazy" style="max-width:100%; height:auto; border:1px solid var(--border);"></p>
    </div>
  </footer>
</body>
</html>
